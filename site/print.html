<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Print drawing pages · Advent __YEAR__</title><link rel="stylesheet" href="../../assets/site.css"></head><body><div class="print-controls"><a href="../">← __YEAR__ calendar</a><h1 style="font-size:25px;margin:8px 0">Print drawing pages</h1><p id="summary"></p><p>Choose <strong>actual size / 100%</strong>, disable browser headers and footers, and measure the square border: it should be <strong>6 inches (152.4 mm)</strong>.</p><button id="print" class="primary" disabled>Loading pages…</button> <span id="status" role="status"></span></div><main class="print-page" id="sheets"></main><script>
'use strict';const params=new URLSearchParams(location.search),from=Number(params.get('from')||1),to=Number(params.get('to')||25),mode=params.get('mode')||'dots',names={dots:'Numbered dots',art:'Line art only',solved:'Solved drawing + numbers'};const valid=Number.isInteger(from)&&Number.isInteger(to)&&from>=1&&to<=25&&to>=from&&Object.hasOwn(names,mode);if(!valid){document.getElementById('status').textContent='Invalid page selection. Return to the calendar and choose dates from December 1–25.';document.getElementById('print').hidden=true}else{document.getElementById('summary').textContent=`${names[mode]} · December ${from}${to!==from?'–'+to:''}, __YEAR__ · ${to-from+1} page${to>from?'s':''}`;document.getElementById('sheets').innerHTML=Array.from({length:to-from+1},(_,i)=>`<article class="print-sheet"><h2>December ${from+i}, __YEAR__</h2><img src="../tiles/${String(from+i).padStart(2,'0')}/${mode}.svg" alt="December ${from+i}: ${names[mode]}"><p>25 Days of Christmas Sudoku · Six-inch tile · Print at 100%</p></article>`).join('');Promise.all([...document.images].map(im=>im.decode())).then(()=>{const button=document.getElementById('print');button.disabled=false;button.textContent='Print / Save as PDF';button.onclick=()=>window.print();window.printReady=true}).catch(()=>document.getElementById('status').textContent='A drawing could not load. Reload before printing.');}
</script></body></html>
